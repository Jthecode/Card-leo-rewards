<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Product | Card Leo Rewards</title>

    <meta
      name="description"
      content="Shop premium Card Leo Rewards merchandise, fragrance, apparel, and limited editions."
    />

    <meta name="theme-color" content="#030303" />

    <link
      rel="canonical"
      href="https://www.cardleorewards.com/product.html"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --leo-black: #030303;
        --leo-black-2: #080808;
        --leo-panel: rgba(14, 14, 14, 0.95);

        --leo-gold: #e7b64f;
        --leo-gold-2: #f7d98b;
        --leo-gold-dark: #95620c;

        --leo-white: #f8f3e7;

        --leo-muted:
          rgba(
            248,
            243,
            231,
            0.68
          );

        --leo-muted-2:
          rgba(
            248,
            243,
            231,
            0.46
          );

        --leo-line:
          rgba(
            231,
            182,
            79,
            0.2
          );

        --leo-green: #5ef28a;
        --leo-red: #ff7676;

        --leo-shadow:
          0 30px 90px
          rgba(
            0,
            0,
            0,
            0.58
          );
      }

      * {
        box-sizing:
          border-box;
      }

      html {
        scroll-behavior:
          smooth;
      }

      body {
        margin:
          0;

        min-height:
          100vh;

        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        color:
          var(--leo-white);

        background:
          radial-gradient(
            circle at 82% 10%,
            rgba(
              231,
              182,
              79,
              0.12
            ),
            transparent 28%
          ),
          radial-gradient(
            circle at 35% 100%,
            rgba(
              231,
              182,
              79,
              0.06
            ),
            transparent 28%
          ),
          linear-gradient(
            180deg,
            #020202 0%,
            #070707 46%,
            #010101 100%
          );
      }

      a {
        color:
          inherit;

        text-decoration:
          none;
      }

      button,
      select,
      input {
        font:
          inherit;
      }

      button {
        cursor:
          pointer;
      }

      .container {
        width:
          min(
            1240px,
            calc(
              100% - 32px
            )
          );

        margin:
          0 auto;
      }

      /* ================================================================
         HEADER
      ================================================================ */

      .site-header {
        position:
          sticky;

        top:
          0;

        z-index:
          100;

        border-bottom:
          1px solid
          rgba(
            231,
            182,
            79,
            0.16
          );

        background:
          rgba(
            0,
            0,
            0,
            0.88
          );

        backdrop-filter:
          blur(
            18px
          );
      }

      .nav-wrap {
        min-height:
          78px;

        display:
          flex;

        align-items:
          center;

        justify-content:
          space-between;

        gap:
          18px;
      }

      .brand {
        display:
          inline-flex;

        align-items:
          center;

        gap:
          12px;
      }

      .brand-mark {
        width:
          48px;

        height:
          48px;

        display:
          grid;

        place-items:
          center;

        border-radius:
          16px;

        border:
          1px solid
          rgba(
            231,
            182,
            79,
            0.35
          );

        background:
          radial-gradient(
            circle at top,
            rgba(
              247,
              217,
              139,
              0.25
            ),
            transparent 48%
          ),
          linear-gradient(
            145deg,
            #0c0c0c,
            #000
          );

        color:
          var(--leo-gold-2);

        font-weight:
          900;
      }

      .brand-copy {
        display:
          grid;

        gap:
          1px;
      }

      .brand-copy strong {
        font-family:
          "Playfair Display",
          serif;

        font-size:
          1.1rem;
      }

      .brand-copy span {
        color:
          var(--leo-gold);

        font-size:
          0.68rem;

        font-weight:
          800;

        letter-spacing:
          0.12em;

        text-transform:
          uppercase;
      }

      .nav-links {
        display:
          flex;

        align-items:
          center;

        gap:
          18px;
      }

      .nav-links a {
        color:
          var(--leo-muted);

        font-size:
          0.9rem;

        font-weight:
          700;
      }

      .nav-links a:hover {
        color:
          var(--leo-gold-2);
      }

      .cart-link {
        min-height:
          44px;

        display:
          inline-flex;

        align-items:
          center;

        gap:
          9px;

        padding:
          0 16px;

        border-radius:
          999px;

        border:
          1px solid
          var(--leo-line);

        background:
          rgba(
            255,
            255,
            255,
            0.04
          );
      }

      .cart-count {
        min-width:
          24px;

        height:
          24px;

        display:
          inline-grid;

        place-items:
          center;

        padding:
          0 7px;

        border-radius:
          999px;

        background:
          linear-gradient(
            135deg,
            #f7d98b,
            #b87912
          );

        color:
          #060606;

        font-size:
          0.72rem;

        font-weight:
          900;
      }

      /* ================================================================
         BREADCRUMB
      ================================================================ */

      .breadcrumb {
        padding:
          26px 0 0;

        color:
          var(--leo-muted-2);

        font-size:
          0.8rem;
      }

      .breadcrumb a {
        color:
          var(--leo-gold);
      }

      /* ================================================================
         PRODUCT
      ================================================================ */

      .product-section {
        padding:
          34px 0 90px;
      }

      .product-layout {
        display:
          grid;

        grid-template-columns:
          minmax(
            0,
            1fr
          )
          minmax(
            340px,
            0.9fr
          );

        gap:
          48px;

        align-items:
          start;
      }

      /* ================================================================
         GALLERY
      ================================================================ */

      .gallery {
        display:
          grid;

        gap:
          14px;
      }

      .main-image {
        min-height:
          560px;

        position:
          relative;

        overflow:
          hidden;

        border-radius:
          30px;

        border:
          1px solid
          var(--leo-line);

        background:
          radial-gradient(
            circle at 76% 14%,
            rgba(
              247,
              217,
              139,
              0.15
            ),
            transparent 31%
          ),
          linear-gradient(
            145deg,
            #0a0a0a,
            #030303
          );

        display:
          grid;

        place-items:
          center;

        box-shadow:
          var(--leo-shadow);
      }

      .main-image img {
        width:
          100%;

        height:
          100%;

        object-fit:
          cover;
      }

      .image-placeholder {
        text-align:
          center;

        padding:
          30px;
      }

      .image-placeholder strong {
        display:
          block;

        font-family:
          "Playfair Display",
          serif;

        font-size:
          2rem;

        color:
          var(--leo-gold-2);
      }

      .image-placeholder span {
        display:
          block;

        margin-top:
          10px;

        color:
          var(--leo-muted);

        font-size:
          0.82rem;

        letter-spacing:
          0.12em;

        text-transform:
          uppercase;
      }

      .gallery-thumbnails {
        display:
          grid;

        grid-template-columns:
          repeat(
            4,
            1fr
          );

        gap:
          10px;
      }

      .thumbnail {
        aspect-ratio:
          1 / 1;

        overflow:
          hidden;

        border-radius:
          15px;

        border:
          1px solid
          rgba(
            231,
            182,
            79,
            0.15
          );

        background:
          #0c0c0c;

        cursor:
          pointer;
      }

      .thumbnail img {
        width:
          100%;

        height:
          100%;

        object-fit:
          cover;
      }

      /* ================================================================
         DETAILS
      ================================================================ */

      .details-panel {
        position:
          sticky;

        top:
          110px;

        padding:
          30px;

        border-radius:
          28px;

        border:
          1px solid
          var(--leo-line);

        background:
          radial-gradient(
            circle at top right,
            rgba(
              231,
              182,
              79,
              0.1
            ),
            transparent 35%
          ),
          linear-gradient(
            180deg,
            rgba(
              18,
              18,
              18,
              0.96
            ),
            rgba(
              5,
              5,
              5,
              0.98
            )
          );

        box-shadow:
          var(--leo-shadow);
      }

      .eyebrow {
        color:
          var(--leo-gold);

        font-size:
          0.7rem;

        font-weight:
          900;

        letter-spacing:
          0.14em;

        text-transform:
          uppercase;
      }

      .product-title {
        margin:
          11px 0 0;

        font-family:
          "Playfair Display",
          serif;

        font-size:
          clamp(
            2.2rem,
            5vw,
            4rem
          );

        line-height:
          0.98;

        letter-spacing:
          -0.055em;
      }

      .product-description {
        margin:
          18px 0 0;

        color:
          var(--leo-muted);

        font-size:
          0.96rem;

        line-height:
          1.75;
      }

      /* ================================================================
         PRICE
      ================================================================ */

      .price-row {
        display:
          flex;

        align-items:
          baseline;

        flex-wrap:
          wrap;

        gap:
          9px;

        margin-top:
          24px;
      }

      .price {
        font-size:
          2rem;

        font-weight:
          900;
      }

      .compare-price {
        color:
          var(--leo-muted-2);

        text-decoration:
          line-through;
      }

      .member-price-box {
        margin-top:
          13px;

        padding:
          14px;

        border-radius:
          15px;

        border:
          1px solid
          rgba(
            94,
            242,
            138,
            0.18
          );

        background:
          rgba(
            94,
            242,
            138,
            0.07
          );
      }

      .member-price-box span {
        color:
          rgba(
            203,
            255,
            218,
            0.75
          );

        font-size:
          0.8rem;
      }

      .member-price-box strong {
        display:
          block;

        margin-top:
          3px;

        color:
          var(--leo-green);

        font-size:
          1.3rem;
      }

      /* ================================================================
         STOCK
      ================================================================ */

      .stock-status {
        display:
          inline-flex;

        align-items:
          center;

        gap:
          8px;

        margin-top:
          18px;

        color:
          var(--leo-green);

        font-size:
          0.82rem;

        font-weight:
          800;
      }

      .stock-status::before {
        content:
          "";

        width:
          8px;

        height:
          8px;

        border-radius:
          999px;

        background:
          currentColor;

        box-shadow:
          0 0 14px
          currentColor;
      }

      .stock-status.sold-out {
        color:
          var(--leo-red);
      }

      /* ================================================================
         OPTIONS
      ================================================================ */

      .option-group {
        margin-top:
          24px;
      }

      .option-group label {
        display:
          block;

        margin-bottom:
          9px;

        color:
          var(--leo-white);

        font-size:
          0.82rem;

        font-weight:
          900;
      }

      .option-group select,
      .option-group input {
        width:
          100%;

        min-height:
          50px;

        padding:
          0 14px;

        border-radius:
          14px;

        border:
          1px solid
          rgba(
            231,
            182,
            79,
            0.2
          );

        background:
          #101010;

        color:
          var(--leo-white);

        outline:
          none;
      }

      .option-row {
        display:
          grid;

        grid-template-columns:
          1fr 1fr;

        gap:
          12px;
      }

      /* ================================================================
         QUANTITY
      ================================================================ */

      .quantity-control {
        display:
          grid;

        grid-template-columns:
          46px
          1fr
          46px;

        gap:
          8px;
      }

      .quantity-control button {
        min-height:
          46px;

        border-radius:
          13px;

        border:
          1px solid
          var(--leo-line);

        background:
          rgba(
            255,
            255,
            255,
            0.04
          );

        color:
          var(--leo-white);

        font-size:
          1.2rem;

        font-weight:
          900;
      }

      .quantity-control input {
        text-align:
          center;
      }

      /* ================================================================
         BUTTONS
      ================================================================ */

      .purchase-actions {
        display:
          grid;

        gap:
          10px;

        margin-top:
          26px;
      }

      .btn {
        min-height:
          52px;

        display:
          inline-flex;

        align-items:
          center;

        justify-content:
          center;

        gap:
          9px;

        border-radius:
          999px;

        border:
          1px solid
          transparent;

        padding:
          0 18px;

        font-weight:
          900;
      }

      .btn-primary {
        background:
          linear-gradient(
            135deg,
            #f7d98b,
            #d89a22 55%,
            #8b5b0b
          );

        color:
          #060606;
      }

      .btn-secondary {
        border-color:
          var(--leo-line);

        background:
          rgba(
            255,
            255,
            255,
            0.04
          );

        color:
          var(--leo-white);
      }

      .btn:disabled {
        cursor:
          not-allowed;

        opacity:
          0.45;
      }

      /* ================================================================
         INFO
      ================================================================ */

      .product-info {
        margin-top:
          24px;

        display:
          grid;

        gap:
          10px;
      }

      .info-row {
        display:
          flex;

        justify-content:
          space-between;

        gap:
          12px;

        padding:
          11px 0;

        border-bottom:
          1px solid
          rgba(
            255,
            255,
            255,
            0.06
          );

        font-size:
          0.8rem;
      }

      .info-row span {
        color:
          var(--leo-muted);
      }

      .info-row strong {
        color:
          var(--leo-gold-2);

        text-align:
          right;
      }

      /* ================================================================
         NOTES
      ================================================================ */

      .fragrance-notes {
        margin-top:
          30px;

        padding-top:
          24px;

        border-top:
          1px solid
          var(--leo-line);
      }

      .fragrance-notes h3 {
        margin:
          0 0 14px;

        font-family:
          "Playfair Display",
          serif;

        font-size:
          1.35rem;
      }

      .notes-grid {
        display:
          grid;

        grid-template-columns:
          repeat(
            3,
            1fr
          );

        gap:
          10px;
      }

      .note-card {
        padding:
          13px;

        border-radius:
          14px;

        border:
          1px solid
          rgba(
            231,
            182,
            79,
            0.12
          );

        background:
          rgba(
            255,
            255,
            255,
            0.03
          );
      }

      .note-card span {
        display:
          block;

        color:
          var(--leo-gold);

        font-size:
          0.68rem;

        font-weight:
          900;

        letter-spacing:
          0.1em;

        text-transform:
          uppercase;
      }

      .note-card strong {
        display:
          block;

        margin-top:
          6px;

        font-size:
          0.82rem;

        line-height:
          1.45;
      }

      /* ================================================================
         STATES
      ================================================================ */

      .state-box {
        grid-column:
          1 / -1;

        padding:
          50px 24px;

        border-radius:
          24px;

        border:
          1px dashed
          var(--leo-line);

        text-align:
          center;

        color:
          var(--leo-muted);
      }

      .state-box strong {
        display:
          block;

        margin-bottom:
          8px;

        color:
          var(--leo-gold-2);

        font-size:
          1.1rem;
      }

      /* ================================================================
         TOAST
      ================================================================ */

      .toast {
        position:
          fixed;

        right:
          20px;

        bottom:
          20px;

        z-index:
          200;

        max-width:
          340px;

        padding:
          14px 16px;

        border-radius:
          15px;

        border:
          1px solid
          var(--leo-line);

        background:
          #0b0b0b;

        color:
          var(--leo-white);

        box-shadow:
          0 22px 60px
          rgba(
            0,
            0,
            0,
            0.6
          );

        opacity:
          0;

        transform:
          translateY(
            12px
          );

        pointer-events:
          none;

        transition:
          0.2s ease;
      }

      .toast.show {
        opacity:
          1;

        transform:
          translateY(
            0
          );
      }

      /* ================================================================
         RESPONSIVE
      ================================================================ */

      @media (
        max-width:
          980px
      ) {
        .product-layout {
          grid-template-columns:
            1fr;
        }

        .details-panel {
          position:
            static;
        }

        .main-image {
          min-height:
            480px;
        }
      }

      @media (
        max-width:
          760px
      ) {
        .nav-links a:not(
          .cart-link
        ) {
          display:
            none;
        }

        .product-section {
          padding-top:
            24px;
        }

        .details-panel {
          padding:
            22px;
        }

        .main-image {
          min-height:
            390px;
        }

        .option-row,
        .notes-grid {
          grid-template-columns:
            1fr;
        }
      }
    </style>
  </head>

  <body>
    <!-- ================================================================
         HEADER
    ================================================================= -->

    <header class="site-header">
      <div class="container nav-wrap">
        <a
          class="brand"
          href="/"
        >
          <div class="brand-mark">
            CL
          </div>

          <div class="brand-copy">
            <strong>
              Card Leo Rewards
            </strong>

            <span>
              Card Leo Shop
            </span>
          </div>
        </a>

        <nav class="nav-links">
          <a href="/">
            Home
          </a>

          <a href="/shop.html">
            Shop
          </a>

          <a href="/login.html">
            Member Login
          </a>

          <a
            class="cart-link"
            href="/cart.html"
          >
            Cart

            <span
              class="cart-count"

      </div>
    </header>

    <!-- ================================================================
         BREADCRUMB
    ================================================================= -->

    <div class="container breadcrumb">

        Shop

      </span>

      >

      </div>

    <!-- ================================================================
         TOAST
    ================================================================= -->

      aria-live="polite"
    ></div>

          "card-leo-signature-t-shirt": {
            id:
              "fallback-shirt",

            name:
              "Card Leo Signature T-Shirt",

            slug:
              "card-leo-signature-t-shirt",

            description:
              "Premium Card Leo Rewards signature shirt designed for everyday wear.",

            short_description:
              "Card Leo signature premium shirt.",

            category:
              "apparel",

            product_type:
              "apparel",

            price_cents:
              4999,

            member_price_cents:
              3999,

            compare_at_price_cents:
              5999,

            currency:
              "USD",

            sku:
              "CLR-SHIRT-001",

            inventory_quantity:
              100,

            image_url:
              "",

            secondary_image_url:
              "",

            gallery_images:
              [],

            available_sizes: [
              "S",
              "M",
              "L",
              "XL",
              "2XL",
            ],

            available_colors: [
              "Black",
            ],

            material:
              "Premium Cotton",

            fit:
              "Regular",

            is_active:
              true,

            is_featured:
              true,

            is_new:
              true,
          },
        };

        /* ==============================================================
           HELPERS
        ============================================================== */

        function normalizeText(
          value
        ) {
          return String(
            value ?? ""
          ).trim();
        }

        function normalizeLower(
          value
        ) {
          return normalizeText(
            value
          ).toLowerCase();
        }

        function centsToMoney(
          cents
        ) {
          const value =
            Number(
              cents ||
              0
            );

          const dollars =
            Number.isFinite(
              value
            )
              ? value / 100
              : 0;

          return new Intl.NumberFormat(
            "en-US",
            {
              style:
                "currency",

              currency:
                "USD",
            }
          ).format(
            dollars
          );
        }

        function escapeHtml(
          value
        ) {
          return String(
            value ?? ""
          )
            .replaceAll(
              "&",
              "&amp;"
            )
            .replaceAll(
              "<",
              "&lt;"
            )
            .replaceAll(
              ">",
              "&gt;"
            )
            .replaceAll(
              '"',
              "&quot;"
            )
            .replaceAll(
              "'",
              "&#39;"
            );
        }

        function titleCase(
          value
        ) {
          return normalizeText(
            value
          )
            .replace(
              /[_-]+/g,
              " "
            )
            .split(
              /\s+/
            )
            .filter(
              Boolean
            )
            .map(
              (word) =>
                word
                  .charAt(0)
                  .toUpperCase() +
                word
                  .slice(1)
                  .toLowerCase()
            )
            .join(" ");
        }

        function getSlug() {
          const params =
            new URLSearchParams(
              window.location.search
            );

          return normalizeText(
            params.get(
              "slug"
            )
          );
        }

        /* ==============================================================
           TOAST
        ============================================================== */

        let toastTimer =
          null;

        function showToast(
          message
        ) {
          if (
            !els.toast
          ) {
            return;
          }

          els.toast.textContent =
            message;

          els.toast.classList.add(
            "show"
          );

          clearTimeout(
            toastTimer
          );

          toastTimer =
            setTimeout(
              () => {
                els.toast
                  ?.classList
                  .remove(
                    "show"
                  );
              },
              2600
            );
        }

        /* ==============================================================
           CART
        ============================================================== */

        function getCart() {
          try {
            const raw =
              localStorage.getItem(
                "cardleo_shop_cart"
              );

            const parsed =
              raw
                ? JSON.parse(
                    raw
                  )
                : [];

            return Array.isArray(
              parsed
            )
              ? parsed
              : [];
          } catch {
            return [];
          }
        }

        function saveCart(
          cart
        ) {
          localStorage.setItem(
            "cardleo_shop_cart",
            JSON.stringify(
              cart
            )
          );

          updateCartCount();
        }

        function updateCartCount() {
          const cart =
            getCart();

          const count =
            cart.reduce(
              (
                total,
                item
              ) =>
                total +
                Number(
                  item.quantity ||
                  1
                ),
              0
            );

          if (
            els.cartCount
          ) {
            els.cartCount.textContent =
              String(
                count
              );
          }
        }

        /* ==============================================================
           NORMALIZE PRODUCT
        ============================================================== */

        function normalizeProduct(
          row
        ) {
          return {
            ...row,

            id:
              row.id,

            name:
              normalizeText(
                row.name
              ),

            slug:
              normalizeText(
                row.slug
              ),

            description:
              normalizeText(
                row.description ||
                row.short_description
              ),

            short_description:
              normalizeText(
                row.short_description
              ),

            category:
              normalizeLower(
                row.category ||
                "merchandise"
              ),

            product_type:
              normalizeLower(
                row.product_type ||
                "physical"
              ),

            price_cents:
              Number(
                row.price_cents ||
                0
              ),

            member_price_cents:
              row.member_price_cents ==
              null
                ? null
                : Number(
                    row.member_price_cents
                  ),

            compare_at_price_cents:
              row.compare_at_price_cents ==
              null
                ? null
                : Number(
                    row.compare_at_price_cents
                  ),

            inventory_quantity:
              Number(
                row.inventory_quantity ??
                0
              ),

            gallery_images:
              Array.isArray(
                row.gallery_images
              )
                ? row.gallery_images
                : [],

            available_sizes:
              Array.isArray(
                row.available_sizes
              )
                ? row.available_sizes
                : [],

            available_colors:
              Array.isArray(
                row.available_colors
              )
                ? row.available_colors
                : [],

            fragrance_top_notes:
              Array.isArray(
                row.fragrance_top_notes
              )
                ? row.fragrance_top_notes
                : [],

            fragrance_middle_notes:
              Array.isArray(
                row.fragrance_middle_notes
              )
                ? row.fragrance_middle_notes
                : [],

            fragrance_base_notes:
              Array.isArray(
                row.fragrance_base_notes
              )
                ? row.fragrance_base_notes
                : [],
          };
        }

        /* ==============================================================
           GALLERY
        ============================================================== */

        function getProductImages(
          product
        ) {
          return [
            product.image_url,
            product.secondary_image_url,
            ...product.gallery_images,
          ]
            .map(
              normalizeText
            )
            .filter(
              Boolean
            );
        }

        /* ==============================================================
           SELECT OPTIONS
        ============================================================== */

        function buildSelect(
          id,
          label,
          values
        ) {
          if (
            !Array.isArray(
              values
            ) ||
            !values.length
          ) {
            return "";
          }

          return `
            <div class="option-group">
              <label for="${escapeHtml(
                id
              )}">
                ${escapeHtml(
                  label
                )}
              </label>

              <select id="${escapeHtml(
                id
              )}">
                ${values
                  .map(
                    (value) => `
                      <option value="${escapeHtml(
                        value
                      )}">
                        ${escapeHtml(
                          value
                        )}
                      </option>
                    `
                  )
                  .join("")}
              </select>
            </div>
          `;
        }

        /* ==============================================================
           NOTES
        ============================================================== */

        function notesHtml(
          product
        ) {
          const hasNotes =
            product.fragrance_top_notes.length ||
            product.fragrance_middle_notes.length ||
            product.fragrance_base_notes.length;

          if (
            !hasNotes
          ) {
            return "";
          }

          return `
            <div class="fragrance-notes">

              <h3>
                Fragrance Notes
              </h3>

              <div class="notes-grid">

                <div class="note-card">
                  <span>
                    Top Notes
                  </span>

                  <strong>
                    ${
                      product
                        .fragrance_top_notes
                        .length
                        ? escapeHtml(
                            product
                              .fragrance_top_notes
                              .join(", ")
                          )
                        : "—"
                    }
                  </strong>
                </div>

                <div class="note-card">
                  <span>
                    Heart Notes
                  </span>

                  <strong>
                    ${
                      product
                        .fragrance_middle_notes
                        .length
                        ? escapeHtml(
                            product
                              .fragrance_middle_notes
                              .join(", ")
                          )
                        : "—"
                    }
                  </strong>
                </div>

                <div class="note-card">
                  <span>
                    Base Notes
                  </span>

                  <strong>
                    ${
                      product
                        .fragrance_base_notes
                        .length
                        ? escapeHtml(
                            product
                              .fragrance_base_notes
                              .join(", ")
                          )
                        : "—"
                    }
                  </strong>
                </div>

              </div>

            </div>
          `;
        }

        /* ==============================================================
           PRODUCT INFO
        ============================================================== */

        function productInfoHtml(
          product
        ) {
          const rows =
            [];

          if (
            product.sku
          ) {
            rows.push([
              "SKU",
              product.sku,
            ]);
          }

          if (
            product.fragrance_size_ml
          ) {
            rows.push([
              "Size",
              `${product.fragrance_size_ml} ML`,
            ]);
          }

          if (
            product.fragrance_concentration
          ) {
            rows.push([
              "Concentration",
              product.fragrance_concentration,
            ]);
          }

          if (
            product.material
          ) {
            rows.push([
              "Material",
              product.material,
            ]);
          }

          if (
            product.fit
          ) {
            rows.push([
              "Fit",
              product.fit,
            ]);
          }

          rows.push([
            "Category",
            titleCase(
              product.category
            ),
          ]);

          return `
            <div class="product-info">
              ${rows
                .map(
                  ([label, value]) => `
                    <div class="info-row">
                      <span>
                        ${escapeHtml(
                          label
                        )}
                      </span>

                      <strong>
                        ${escapeHtml(
                          value
                        )}
                      </strong>
                    </div>
                  `
                )
                .join("")}
            </div>
          `;
        }

        /* ==============================================================
           RENDER
        ============================================================== */

        function renderProduct() {
          if (
            !product
          ) {
            return;
          }

          document.title =
            `${product.name} | Card Leo Rewards`;

          if (
            els.breadcrumbProduct
          ) {
            els.breadcrumbProduct.textContent =
              product.name;
          }

          const images =
            getProductImages(
              product
            );

          const soldOut =
            product.inventory_quantity <=
            0;

          const mainImageHtml =
            images.length
              ? `
                  <img
                    id="mainProductImage"
                    src="${escapeHtml(
                      images[0]
                    )}"
                    alt="${escapeHtml(
                      product.name
                    )}"
                  />
                `
              : `
                  <div class="image-placeholder">
                    <strong>
                      CARD LEO
                    </strong>

                    <span>
                      ${escapeHtml(
                        titleCase(
                          product.category
                        )
                      )}
                    </span>
                  </div>
                `;

          const thumbnailHtml =
            images.length > 1
              ? `
                  <div class="gallery-thumbnails">
                    ${images
                      .map(
                        (image) => `
                          <button
                            type="button"
                            class="thumbnail"
                            data-image="${escapeHtml(
                              image
                            )}"
                          >
                            <img
                              src="${escapeHtml(
                                image
                              )}"
                              alt=""
                            />
                          </button>
                        `
                      )
                      .join("")}
                  </div>
                `
              : "";

          const comparePrice =
            Number(
              product.compare_at_price_cents ||
              0
            );

          const memberPrice =
            Number(
              product.member_price_cents ||
              0
            );

          const memberPriceHtml =
            memberPrice > 0 &&
            memberPrice <
              product.price_cents
              ? `
                  <div class="member-price-box">
                    <span>
                      Card Leo Member Price
                    </span>

                    <strong>
                      ${escapeHtml(
                        centsToMoney(
                          memberPrice
                        )
                      )}
                    </strong>
                  </div>
                `
              : "";

          const sizeSelect =
            buildSelect(
              "sizeSelect",
              "Size",
              product.available_sizes
            );

          const colorSelect =
            buildSelect(
              "colorSelect",
              "Color",
              product.available_colors
            );

          els.productLayout.innerHTML = `
            <section class="gallery">

              <div class="main-image">
                ${mainImageHtml}
              </div>

              ${thumbnailHtml}

            </section>

            <section class="details-panel">

              <div class="eyebrow">
                ${escapeHtml(
                  titleCase(
                    product.category
                  )
                )}
              </div>

              <h1 class="product-title">
                ${escapeHtml(
                  product.name
                )}
              </h1>

              <p class="product-description">
                ${escapeHtml(
                  product.description ||
                  "Premium Card Leo product."
                )}
              </p>

              <div class="price-row">

                <span class="price">
                  ${escapeHtml(
                    centsToMoney(
                      product.price_cents
                    )
                  )}
                </span>

                ${
                  comparePrice >
                  product.price_cents
                    ? `
                        <span class="compare-price">
                          ${escapeHtml(
                            centsToMoney(
                              comparePrice
                            )
                          )}
                        </span>
                      `
                    : ""
                }

              </div>

              ${memberPriceHtml}

              <div class="stock-status ${
                soldOut
                  ? "sold-out"
                  : ""
              }">
                ${
                  soldOut
                    ? "Sold Out"
                    : `${product.inventory_quantity} In Stock`
                }
              </div>

              ${
                sizeSelect &&
                colorSelect
                  ? `
                      <div class="option-row">
                        ${sizeSelect}
                        ${colorSelect}
                      </div>
                    `
                  : `
                      ${sizeSelect}
                      ${colorSelect}
                    `
              }

              <div class="option-group">
                <label for="quantityInput">
                  Quantity
                </label>

                <div class="quantity-control">

                  <button
                    type="button"
                    id="minusQuantity"
                  >
                    −
                  </button>

                  <input
                    id="quantityInput"
                    type="number"
                    min="1"
                    max="${Math.max(
                      1,
                      product.inventory_quantity
                    )}"
                    value="1"
                  />

                  <button
                    type="button"
                    id="plusQuantity"
                  >
                    +
                  </button>

                </div>
              </div>

              <div class="purchase-actions">

                <button
                  type="button"
                  class="btn btn-primary"
                  id="addToCartButton"
                  ${
                    soldOut
                      ? "disabled"
                      : ""
                  }
                >
                  ${
                    soldOut
                      ? "Sold Out"
                      : "Add To Cart"
                  }
                </button>

                <a
                  href="/cart.html"
                  class="btn btn-secondary"
                >
                  View Cart
                </a>

              </div>

              ${productInfoHtml(
                product
              )}

              ${notesHtml(
                product
              )}

            </section>
          `;

          bindProductEvents();
        }

        /* ==============================================================
           PRODUCT EVENTS
        ============================================================== */

        function bindProductEvents() {
          const quantityInput =
            document.getElementById(
              "quantityInput"
            );

          const minusButton =
            document.getElementById(
              "minusQuantity"
            );

          const plusButton =
            document.getElementById(
              "plusQuantity"
            );

          const addButton =
            document.getElementById(
              "addToCartButton"
            );

          minusButton
            ?.addEventListener(
              "click",
              () => {
                const value =
                  Math.max(
                    1,
                    Number(
                      quantityInput.value ||
                      1
                    ) -
                    1
                  );

                quantityInput.value =
                  String(
                    value
                  );
              }
            );

          plusButton
            ?.addEventListener(
              "click",
              () => {
                const max =
                  Math.max(
                    1,
                    product.inventory_quantity
                  );

                const value =
                  Math.min(
                    max,
                    Number(
                      quantityInput.value ||
                      1
                    ) +
                    1
                  );

                quantityInput.value =
                  String(
                    value
                  );
              }
            );

          addButton
            ?.addEventListener(
              "click",
              () => {
                addCurrentProductToCart();
              }
            );

          document
            .querySelectorAll(
              "[data-image]"
            )
            .forEach(
              (button) => {
                button.addEventListener(
                  "click",
                  () => {
                    const main =
                      document.getElementById(
                        "mainProductImage"
                      );

                    if (
                      main &&
                      button.dataset.image
                    ) {
                      main.src =
                        button.dataset.image;
                    }
                  }
                );
              }
            );
        }

        /* ==============================================================
           ADD CURRENT PRODUCT
        ============================================================== */

        function addCurrentProductToCart() {
          if (!product) {
            return;
          }

          const quantityInput =
            document.getElementById(
              "quantityInput"
            );

          const sizeSelect =
            document.getElementById(
              "sizeSelect"
            );

          const colorSelect =
            document.getElementById(
              "colorSelect"
            );

          const quantity =
            Math.max(
              1,
              Math.min(
                Number(
                  product.inventory_quantity ||
                  1
                ),
                Number(
                  quantityInput?.value ||
                  1
                )
              )
            );

          if (
            product.available_sizes.length &&
            !sizeSelect?.value
          ) {
            showToast(
              "Please select a size."
            );

            return;
          }

          if (
            product.available_colors.length &&
            !colorSelect?.value
          ) {
            showToast(
              "Please select a color."
            );

            return;
          }

          const cart =
            getCart();

          const size =
            normalizeText(
              sizeSelect?.value
            );

          const color =
            normalizeText(
              colorSelect?.value
            );

          const key =
            [
              product.id,
              size,
              color,
            ].join("|");

          const existing =
            cart.find(
              (item) =>
                item.key ===
                key
            );

          if (existing) {
            existing.quantity =
              Number(
                existing.quantity ||
                1
              ) +
              quantity;
          } else {
            cart.push({
              key,

              productId:
                product.id,

              slug:
                product.slug,

              quantity,

              size,

              color,

              fragranceSizeMl:
                product.fragrance_size_ml ||
                null,
            });
          }

          saveCart(
            cart
          );

          showToast(
            `${product.name} added to cart.`
          );
        }

        /* ==============================================================
           LOAD PRODUCT
        ============================================================== */

        async function loadProduct() {
          const slug =
            getSlug();

          if (!slug) {
            els.productLayout.innerHTML = `
              <div class="state-box">
                <strong>
                  Product Not Found
                </strong>

                No product was selected.

                <br /><br />

                <a href="/shop.html">
                  Return To Shop
                </a>
              </div>
            `;

            return;
          }

          try {
            const response =
              await fetch(
                `${PRODUCT_API}?slug=${encodeURIComponent(
                  slug
                )}`,
                {
                  method:
                    "GET",

                  headers: {
                    Accept:
                      "application/json",
                  },

                  cache:
                    "no-store",
                }
              );

            const payload =
              await response
                .json()
                .catch(
                  () => ({})
                );

            if (
              !response.ok
            ) {
              throw new Error(
                payload?.message ||
                "Unable to load product."
              );
            }

            const row =
              payload.product ||
              payload.data?.product ||
              payload.data ||
              null;

            if (!row) {
              throw new Error(
                "Product was not found."
              );
            }

            product =
              normalizeProduct(
                row
              );

            renderProduct();
          } catch (
            error
          ) {
            console.warn(
              "Product API unavailable:",
              error
            );

            const fallback =
              fallbackProducts[
                slug
              ];

            if (fallback) {
              product =
                normalizeProduct(
                  fallback
                );

              renderProduct();

              return;
            }

            els.productLayout.innerHTML = `
              <div class="state-box">

                <strong>
                  Product Not Found
                </strong>

                This Card Leo product is not available.

                <br /><br />

                <a href="/shop.html">
                  Return To Shop
                </a>

              </div>
            `;
          }
        }

        /* ==============================================================
           START
        ============================================================== */

        updateCartCount();

        loadProduct();
      })();
    </script>
  </body>
</html>
